name: Update wording
on:
  push:
    paths: ['.github/workflows/wording.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['README.md','analysis/analyze.py']:
              p=Path(name)
              p.write_text(p.read_text().replace('publication adaptation','system'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md analysis/analyze.py
          git rm .github/workflows/wording.yml
          git commit -m "Use system wording"
          git push
